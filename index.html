  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade { animation: fadeIn 0.22s ease-out forwards; }
    
    @keyframes bounceSlow { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .animate-bounce-slow { animation: bounceSlow 1.8s infinite ease-in-out; }
    
    @keyframes marqueeText { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-50%, 0, 0); } }
    .animate-marquee {
      display: inline-block; white-space: nowrap;
      animation: marqueeText 22s linear infinite;
      will-change: transform;
      backface-visibility: hidden;
      perspective: 1000px;
      transform: translateZ(0);
    }

    @keyframes neonPulseAlert {
      0%, 100% { box-shadow: 0 0 6px #e11d48, 0 0 14px #e11d48; background: linear-gradient(135deg, #ffe4e6, #fecdd3); color: #9f1239; border-color: #f43f5e; }
      50% { box-shadow: 0 0 2px #e11d48; background: #18181b; color: #fb7185; border-color: #e11d48; }
    }
    .neon-alert { animation: neonPulseAlert 1.3s infinite ease-in-out; font-weight: 900; }

    /* Efecto Desintegración de Burbuja (Estilo Telegram / Thanos) */
    @keyframes bubbleShrinkImplode {
      0% { transform: scale(1); opacity: 1; filter: blur(0px); }
      40% { transform: scale(1.12); opacity: 0.9; filter: brightness(1.3); }
      100% { transform: scale(0); opacity: 0; filter: blur(6px); }
    }
    .bubble-disintegrating-core {
      animation: bubbleShrinkImplode 0.48s cubic-bezier(0.55, 0.08, 0.68, 0.53) forwards !important;
      pointer-events: none !important;
    }
    .thanos-particle {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      will-change: transform, opacity;
      transition: transform 0.62s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.62s ease-out;
    }

    .wheel-container {
      position: relative;
      width: 260px;
      height: 260px;
      margin: 0 auto;
      border-radius: 50%;
      border: 6px solid #f43f5e;
      box-shadow: 0 0 25px rgba(244, 63, 94, 0.55), inset 0 0 15px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      transition: transform 4.2s cubic-bezier(0.15, 0.88, 0.18, 1);
      background: conic-gradient(
        #db2777 0deg 60deg,
        #18181b 60deg 120deg,
        #e11d48 120deg 180deg,
        #27272a 180deg 240deg,
        #be185d 240deg 300deg,
        #09090b 300deg 360deg
      );
    }
    .wheel-label {
      position: absolute;
      width: 50%;
      height: 24px;
      top: calc(50% - 12px);
      left: 50%;
      transform-origin: 0% 50%;
      text-align: right;
      padding-right: 16px;
      font-weight: 900;
      font-size: 12px;
      color: #ffffff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      pointer-events: none;
    }

    @media print {
      body * { visibility: hidden !important; }
      #printable-area, #printable-area * { visibility: visible !important; }
      #printable-area { position: absolute !important; left: 0 !important; top: 0 !important; width: 100% !important; max-width: 320px !important; background: #ffffff !important; color: #000000 !important; padding: 8px !important; margin: 0 auto !important; box-shadow: none !important; border: none !important; }
      .no-print { display: none !important; }
    }
  </style>

    function isIOSDevice() {
      const ua = window.navigator.userAgent || '';
      return Boolean(/iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1));
    }
    function isInStandaloneMode() {
      return (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true);
    }

    function generateRBIconDataURL(size = 512) {
      try {
        const canvas = document.createElement('canvas'); canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, size, size);
        ctx.strokeStyle = '#db2777'; ctx.lineWidth = Math.round(size * 0.03);
        ctx.strokeRect(Math.round(size * 0.04), Math.round(size * 0.04), Math.round(size * 0.92), Math.round(size * 0.92));
        ctx.fillStyle = '#ffffff'; ctx.font = `900 ${Math.round(size * 0.44)}px sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('RB', size / 2, size * 0.44);
        ctx.fillStyle = '#ec4899'; ctx.font = `800 ${Math.round(size * 0.085)}px sans-serif`; ctx.fillText('BOUTIQUE', size / 2, size * 0.76);
        return canvas.toDataURL('image/png');
      } catch (e) { return ''; }
    }

    function initDynamicPwaManifest() {
      const icon192 = generateRBIconDataURL(192);
      const icon512 = generateRBIconDataURL(512);
      const appleLink = document.getElementById('apple-touch-icon-link');
      if (appleLink && icon192) appleLink.href = icon192;
      const manifestObj = { name: 'RB Boutique', short_name: 'RB Boutique', display: 'standalone', background_color: '#000000', theme_color: '#000000', icons: [{ src: icon192, sizes: '192x192', type: 'image/png' }, { src: icon512, sizes: '512x512', type: 'image/png' }] };
      try {
        const blob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
        const manifestLink = document.getElementById('pwa-manifest-link');
        if (manifestLink) manifestLink.href = URL.createObjectURL(blob);
      } catch (e) {}
    }

    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredInstallPrompt = e; renderApp(); });
    window.addEventListener('appinstalled', () => { deferredInstallPrompt = null; state.isAppInstalled = true; state.showPwaInstallModal = false; showToast('¡App Oficial instalada!'); renderApp(); });

    window.handleInstallClick = async function () {
      if (deferredInstallPrompt) {
        deferredInstallPrompt.prompt();
        const { outcome } = await deferredInstallPrompt.userChoice;
        if (outcome === 'accepted') { deferredInstallPrompt = null; state.isAppInstalled = true; state.showPwaInstallModal = false; }

    function normalizeFirebaseList(val) {
      if (!val) return [];
      if (Array.isArray(val)) return val.filter(Boolean);
      if (typeof val === 'object') return Object.values(val).filter(Boolean);
      return [];
    }

    function loadStored(key, fallback) { try { const raw = window.localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; } catch (e) { return fallback; } }
    
    function saveStored(key, data) { 
      try { window.localStorage.setItem(key, JSON.stringify(data)); } catch (e) {} 
      if (window.dbRef) { 
        if (key !== 'rb_boutique_visits') {
          window.pendingSavesCount = (window.pendingSavesCount || 0) + 1;
          window.isSavingData = true;
          if (window.saveShieldTimer) clearTimeout(window.saveShieldTimer);
        }
        window.dbRef.child(key).set(data)
          .then(() => {
            if (key !== 'rb_boutique_visits') {
              window.pendingSavesCount = Math.max(0, (window.pendingSavesCount || 1) - 1);
              if (window.pendingSavesCount === 0) {
                window.saveShieldTimer = setTimeout(() => { window.isSavingData = false; }, 2000);
              }
            }
          })
          .catch(e => {
            if (key !== 'rb_boutique_visits') {
              window.pendingSavesCount = Math.max(0, (window.pendingSavesCount || 1) - 1);
              if (window.pendingSavesCount === 0) window.isSavingData = false;
            }
          }); 
      } else {
        window.isSavingData = false;
      }
    }

    // MOTOR DE DESINTEGRACIÓN EN PARTÍCULAS (EFECTO TELEGRAM / THANOS)
    window.desintegrarBurbuja = function() {
      if (state.isBubbleDisintegrating) return;
      const bubbleBtn = document.getElementById('floating-support-bubble-btn');
      let centerX = window.innerWidth - 44;
      let centerY = window.innerHeight - 108;

      if (bubbleBtn) {
        const rect = bubbleBtn.getBoundingClientRect();
        if (rect.width > 0 && rect.height > 0) {
          centerX = rect.left + rect.width / 2;
          centerY = rect.top + rect.height / 2;
        }
      }

      state.isSupportChatOpen = false;
      state.isBubbleDisintegrating = true;
      renderApp();

      const colors = ['#ec4899', '#f43f5e', '#ffffff', '#fb7185', '#fda4af', '#db2777'];
      const particles = [];
      const totalParticles = 28;

      for (let i = 0; i < totalParticles; i++) {
        const p = document.createElement('div');
        p.className = 'thanos-particle';
        const size = Math.floor(Math.random() * 6) + 4;
        const color = colors[i % colors.length];
        p.style.width = `${size}px`;
        p.style.height = `${size}px`;
        p.style.backgroundColor = color;
        p.style.boxShadow = `0 0 8px ${color}`;
        p.style.left = `${centerX - size / 2}px`;
        p.style.top = `${centerY - size / 2}px`;
        p.style.transform = 'translate3d(0, 0, 0) scale(1)';
        p.style.opacity = '1';
        document.body.appendChild(p);
        particles.push(p);
      }

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          particles.forEach((p, idx) => {
            const angle = (Math.PI * 2 * idx) / totalParticles + (Math.random() - 0.5) * 0.65;
            const distance = 35 + Math.random() * 65;
            const tx = Math.cos(angle) * distance;
            const ty = Math.sin(angle) * distance - (Math.random() * 18);
            p.style.transform = `translate3d(${tx}px, ${ty}px, 0) scale(0.15) rotate(${Math.random() * 180}deg)`;
            p.style.opacity = '0';
          });
        });
      });

      setTimeout(() => {
        particles.forEach(p => { if (p.parentNode) p.parentNode.removeChild(p); });
        state.isBubbleDisintegrating = false;
        renderApp();
      }, 640);
    };

    function isGiftExpired(gift) {

    function formatRemainingTime(expiresAt) {
      if (!expiresAt) return '03:00:00';
      const diff = Math.max(0, Number(expiresAt) - Date.now());
      if (diff <= 0) return '00:00:00';
      const hrs = Math.floor(diff / 3600000);
      const mins = Math.floor((diff % 3600000) / 60000);
      const secs = Math.floor((diff % 60000) / 1000);
      return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

      provider.setCustomParameters({ prompt: 'select_account' });

      window.auth.signInWithPopup(provider).then((result) => {
        if (result && result.user) {
          handleGoogleUserAuthenticated(result.user);

      }).catch((err) => {
        console.warn("Google Popup aviso:", err);
        if (err && (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request')) {
          showToast('Selecciona tu cuenta de Google para continuar al Paso 2', 'error');
          return;

        showToast('No se pudo conectar con Google (' + (err.code || 'verifica tu ventana emergente') + ')', 'error');

    function getCustomerBagCalculations() {
      const rawMerchandise = state.customerCart.reduce((a, b) => a + b.price * b.qty, 0);
      const isVip = state.authStatus === 'registered' && state.currentUser;
      const vipDiscount = isVip ? Math.round(rawMerchandise * 0.10) : 0;
      let extraRewardDiscount = 0; let extraRewardLabel = '';
      if (state.currentUser && state.currentUser.vipGift && !state.currentUser.vipGift.used && !isGiftExpired(state.currentUser.vipGift) && !state.currentUser.vipGift.savedForLater) {
        const g = state.currentUser.vipGift; extraRewardLabel = `🎁 Cupón VIP (${g.type === 'percent' ? g.value + '%' : '$' + g.value})`;
        extraRewardDiscount = g.type === 'percent' ? Math.round((rawMerchandise - vipDiscount) * (Number(g.value) / 100)) : Number(g.value || 0);
      }
      const netMerchandise = Math.max(0, rawMerchandise - vipDiscount - extraRewardDiscount);
      const isHomeDelivery = state.customerDeliveryType === 'delivery';
      const shippingFee = isHomeDelivery ? 80 : 0; 
      const requiredAdvance50 = isHomeDelivery ? Math.round(netMerchandise * 0.5) + shippingFee : netMerchandise;
      const grandTotal = netMerchandise + shippingFee;
      return { rawMerchandise, vipDiscount, extraRewardDiscount, extraRewardLabel, netMerchandise, isHomeDelivery, shippingFee, requiredAdvance50, grandTotal };
    }

    function getPosCalculations() {
      const merchandiseTotal = state.posCart.reduce((a, b) => a + b.price * b.qty, 0);
      let basePayment = merchandiseTotal;
      if (state.posPaymentStatus === 'anticipo') { basePayment = Math.round(merchandiseTotal * (state.posDeliveryType === 'domicilio' ? 0.5 : 0.3)); }
      const shippingFee = state.posDeliveryType === 'domicilio' ? (Number(state.posShippingFee) || 0) : 0;
      const subtotalBeforeFee = basePayment + shippingFee;
      const isCardTerminal = state.posPaymentMethod === 'tarjeta';
      const terminalFee5Pct = isCardTerminal ? Math.round(subtotalBeforeFee * 0.05) : 0;
      const finalChargeToday = subtotalBeforeFee + terminalFee5Pct;
      const pendingBalance = Math.max(0, (merchandiseTotal + shippingFee) - subtotalBeforeFee);
      const cashChange = state.posPaymentMethod === 'efectivo' && Number(state.cashReceived) > finalChargeToday ? Number(state.cashReceived) - finalChargeToday : 0;
      return { merchandiseTotal, basePayment, shippingFee, subtotalBeforeFee, isCardTerminal, terminalFee5Pct, finalChargeToday, pendingBalance, cashChange };
    }

    // CORTE DEL DÍA (Z) FILTRADO ESTRICTAMENTE POR LA FECHA ACTUAL
    function getCorteZCalculations() {
      const todayDateStr = new Date().toLocaleDateString();
      const validSales = (state.salesHistory || []).filter(s =>
        s.date === todayDateStr &&
        !String(s.status).includes('Devuelto') &&
        !String(s.bankStatus || '').includes('Rechazado') &&
        s.status !== 'Pendiente Entrega' &&
        s.status !== 'Esperando 50%'
      );
      const totalEfectivoVentas = validSales.filter(s => s.method === 'EFECTIVO').reduce((a, b) => a + Number(b.total || 0), 0);
      const totalTarjetaVentas = validSales.filter(s => s.method === 'TARJETA').reduce((a, b) => a + Number(b.total || 0), 0);
      const totalComisionesTerminal = validSales.filter(s => s.method === 'TARJETA').reduce((a, b) => a + Number(b.terminalFee || 0), 0);
      const totalTransferenciaVentas = validSales.filter(s => s.method.includes('TRANSFERENCIA')).reduce((a, b) => a + Number(b.total || 0), 0);
      const totalVentasDia = totalEfectivoVentas + totalTarjetaVentas + totalTransferenciaVentas;
      const openingCash = Number(state.pettyCash.openingBalance || 0);
      const todayExpenses = (state.pettyCash.expenses || []).filter(ex => !ex.date || ex.date === todayDateStr);
      const totalExpenses = todayExpenses.reduce((a, b) => a + Number(b.amount || 0), 0);
      const exactPhysicalCashInDrawer = openingCash + totalEfectivoVentas - totalExpenses;
      return { todayDateStr, validSalesCount: validSales.length, totalEfectivoVentas, totalTarjetaVentas, totalComisionesTerminal, totalTransferenciaVentas, totalVentasDia, openingCash, totalExpenses, exactPhysicalCashInDrawer };
    }

      let targetSliceAngle = 30;
      if (g.type === 'fixed' && Number(g.value) === 150) targetSliceAngle = 330;

      else if (Number(g.value) === 90) targetSliceAngle = 210;
      else if (Number(g.value) === 15) targetSliceAngle = 270;

      const extraSpins = 360 * 6;
      const landingAngle = extraSpins + (360 - targetSliceAngle);

      const wheelEl = document.getElementById('vip-wheel-element');
      if (wheelEl) {
        wheelEl.style.transform = `rotate(${landingAngle}deg)`;

      if (action === 'exit_pos') {

    window.uploadProductImage = function(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;

      const uploadText = document.getElementById('upload-text-btn');
      if (uploadText) uploadText.innerHTML = '⏳ Ajustando foto...';

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          
          // Compresión extrema para asegurar guardado en memoria HTML
          const maxDim = 400; 
          let width = img.width;
          let height = img.height;

          if (width > height && width > maxDim) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          } else if (height >= width && height > maxDim) {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          // Calidad ajustada al 50% (Súper ligero, 0 bloqueos)
          state.newProd.image = canvas.toDataURL('image/jpeg', 0.5);
          showToast('📸 Foto ajustada y optimizada al instante');
          renderApp();
        };
        img.onerror = function() {
          showToast('Formato de imagen no válido', 'error');
          if (uploadText) uploadText.innerHTML = 'Subir desde Galería / Archivos';
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    };

    window.addPosItemFromSearch = function (productId) {

      if ((p.sizes[firstAvail] || 0) <= 0) { showToast('Prenda agotada sin stock', 'error'); return; }
      const cartId = `${p.id}-${firstAvail}`;
      const existing = state.posCart.find(i => i.cartId === cartId);
      if (existing) {
        if (existing.qty + 1 > p.sizes[firstAvail]) { showToast('Stock máximo alcanzado', 'error'); return; }
        existing.qty += 1;
      } else { state.posCart.push({ cartId, productId: p.id, sku: p.sku, name: p.name, price: p.price, size: firstAvail, qty: 1 }); }
      state.posSearch = ''; showToast(`Agregado: ${p.name} (${firstAvail})`); renderApp();

    window.loadWebOrderToPos = function (saleId) {
      const order = (state.pendingWebOrders || []).find(s => s && s.id === saleId);
      if (!order) return;
      const isDelivery = String(order.type || '').includes('Domicilio');
      const rawSum = (order.itemsList || []).reduce((a, b) => a + (Number(b.price) * Number(b.qty)), 0);
      const expectedNet = isDelivery ? Math.max(0, (Number(order.total) - 80) * 2) : Number(order.total);
      const discountRatio = (rawSum > 0 && expectedNet > 0 && expectedNet < rawSum) ? (expectedNet / rawSum) : 1;

      state.activeWebOrderId = order.id;
      state.posCustomerName = order.customer || 'Cliente Web (VIP)';
      state.posCart = (order.itemsList || []).map(it => ({
        cartId: it.cartId || `${it.productId}-${it.size}`,
        productId: it.productId,
        sku: it.sku || 'WEB',
        name: it.name,
        price: Math.round(Number(it.price || 0) * discountRatio),
        size: it.size,
        qty: Number(it.qty) || 1
      }));
      state.posDeliveryType = isDelivery ? 'domicilio' : 'mostrador';
      state.posPaymentStatus = String(order.type || '').includes('Anticipo') ? 'anticipo' : '100';
      state.posDeliveryAddress = order.deliveryAddress || '';
      state.posDeliveryMapUrl = order.deliveryMapUrl || '';
      const nextCalc = getPosCalculations();
      state.cashReceived = String(nextCalc.finalChargeToday);
      showToast(`📥 Pedido ${order.id} cargado en Caja`);
      renderApp();
    };

    window.completePosSale = function () {
      if (state.posCart.length === 0) { showToast('Agrega prendas al ticket antes de cobrar', 'error'); return; }
      const calc = getPosCalculations();

      if (state.posPaymentMethod === 'efectivo') {
        if (state.cashReceived === '' || state.cashReceived === null || state.cashReceived === undefined) {
          state.cashReceived = String(calc.finalChargeToday);
        }
        const receivedAmount = Number(state.cashReceived);
        if (isNaN(receivedAmount) || receivedAmount < calc.finalChargeToday) {
          const missing = Math.max(0, calc.finalChargeToday - (receivedAmount || 0));
          showToast(`⚠️ Monto en efectivo insuficiente. Faltan $${missing} MXN para cubrir los $${calc.finalChargeToday} MXN.`, 'error');
          return;
        }
      }

      for (const item of state.posCart) {
        const prodInStock = state.products.find(p => p.id === item.productId);
        const currentAvail = prodInStock && prodInStock.sizes ? Number(prodInStock.sizes[item.size] || 0) : 0;
        if (!prodInStock || currentAvail < item.qty) {
          showToast(`🚨 Stock agotado o insuficiente para "${item.name}" (Talla ${item.size}). Disponibles: ${currentAvail}`, 'error');
          return;
        }
      }

      // DESCUENTA EL STOCK UNA SOLA VEZ AL COBRAR EN CAJA
      state.products = state.products.map(p => {
        const nextSizes = { ...p.sizes };
        state.posCart.forEach(item => {
          if (item.productId === p.id && nextSizes[item.size] !== undefined) {
            nextSizes[item.size] = Math.max(0, Number(nextSizes[item.size] || 0) - Number(item.qty || 0));
          }
        });
        return { ...p, sizes: nextSizes };
      });
      saveStored('rb_boutique_products', state.products);

      const isFromWeb = Boolean(state.activeWebOrderId);
      const folio = state.activeWebOrderId || `TCK-${Math.floor(1000 + Math.random() * 9000)}`;
      const typeLabel = state.posDeliveryType === 'domicilio' ? '🛵 Domicilio' : '🏪 Mostrador';
      const payLabel = state.posPaymentStatus === 'anticipo' ? 'Anticipo' : '100% Liquidado';

      const saleObj = {
        id: folio,
        date: new Date().toLocaleDateString(),
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        customer: state.posCustomerName || 'Cliente Mostrador',
        channel: isFromWeb ? 'Catálogo App' : 'POS Mostrador',
        type: `${typeLabel} (${payLabel})`,
        method: state.posPaymentMethod.toUpperCase(),
        bankStatus: state.posPaymentMethod === 'efectivo' ? 'En Cajón' : 'Pendiente Banco',
        status: state.posPaymentStatus === 'anticipo' ? 'Anticipo Pagado' : 'Completado',
        stockDeducted: true,
        merchandiseTotal: calc.merchandiseTotal,
        shippingFee: calc.shippingFee,
        subtotalBeforeFee: calc.subtotalBeforeFee,
        terminalFee: calc.terminalFee5Pct,
        total: calc.finalChargeToday,
        pendingBalance: calc.pendingBalance,
        cashChange: calc.cashChange,
        deliveryAddress: state.posDeliveryAddress,
        deliveryMapUrl: state.posDeliveryMapUrl,
        itemsList: [...state.posCart],
        itemsCount: state.posCart.reduce((a, b) => a + b.qty, 0)
      };

      // ELIMINA LA NOTIFICACIÓN DE PENDIENTE Y PASA 1 SOLO TICKET AL HISTORIAL
      if (state.activeWebOrderId) {
        state.pendingWebOrders = (state.pendingWebOrders || []).filter(s => s && s.id !== state.activeWebOrderId);
        saveStored('rb_boutique_pending_orders', state.pendingWebOrders);
        state.activeWebOrderId = null;
      }

      state.salesHistory = [saleObj, ...state.salesHistory];
      saveStored('rb_boutique_sales', state.salesHistory);

      if (state.posCustomerName && state.posCustomerName !== 'Cliente Mostrador') {
        processReferralSuccess(state.posCustomerName);
      }

      state.lastReceipt = saleObj;
      state.posCart = [];
      state.cashReceived = '';
      checkLowStockAlert();
      showToast(`✅ Venta ${folio} cobrada con éxito`);
      renderApp();
    };

                  </div>
                  <div>
                    <label class="text-[10px] font-bold text-pink-400 uppercase block mb-1">Código de Referido (Opcional)</label>
                    <input type="text" value="${state.regForm.referralCode}" oninput="state.regForm.referralCode=this.value;" placeholder="¿Código de invitación? (Opcional)" class="w-full px-4 py-3 rounded-xl bg-pink-900/20 border border-pink-500/50 text-pink-200 uppercase font-mono" />
                  </div>
                  <button type="submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-pink-600 to-rose-500 text-white font-black text-xs shadow-lg">Finalizar y Activar 10% OFF VIP</button>
                </form>
              `}
            </div>
          </div>
        `;
      }

      /* BURBUJA DE CHAT FLOTANTE CON MOTOR DE DESINTEGRACIÓN EN PARTÍCULAS (ESTILO TELEGRAM / THANOS) */
      if (state.appMode === 'storefront' && state.authStatus === 'registered' && state.currentUser) {
        const activeTickets = getClientActiveTickets();
        if (activeTickets.length > 0 || state.isBubbleDisintegrating) {
          const currentTicket = activeTickets[0] || { messages: [], unreadByClient: false };
          const hasUnreadReply = Boolean(currentTicket.unreadByClient) && !state.isBubbleDisintegrating;
          const chatMessages = Array.isArray(currentTicket.messages) && currentTicket.messages.length > 0
            ? currentTicket.messages
            : [{ sender: 'client', text: currentTicket.message || '', time: currentTicket.date || '' }];

          html += `
            <div class="fixed bottom-20 right-4 z-[88] flex flex-col items-end no-print">
              ${(state.isSupportChatOpen && !state.isBubbleDisintegrating) ? `
                <div class="mb-3 w-80 sm:w-96 bg-white rounded-3xl shadow-2xl border border-zinc-200 overflow-hidden animate-fade flex flex-col max-h-[420px]">
                  <div class="bg-gradient-to-r from-zinc-950 via-black to-pink-950 text-white p-4 flex items-center justify-between">
                    <div class="flex items-center gap-2.5">
                      <div class="w-9 h-9 rounded-full bg-gradient-to-br from-zinc-900 to-black border border-pink-500 flex items-center justify-center font-serif italic font-black text-lg text-white shadow relative overflow-hidden"><div class="absolute top-0 left-0 right-0 h-1/2 bg-gradient-to-b from-white/20 to-transparent"></div><span class="pr-0.5 uppercase">${state.storeConfig.brandInitials || 'RB'}</span></div>
                      <div>
                        <h4 class="font-black text-xs">Soporte VIP • RB Boutique</h4>
                        <span class="text-[10px] text-emerald-400 font-bold flex items-center gap-1">● Chat en vivo activo</span>
                      </div>
                    </div>
                    <button onclick="openClientFloatingChat()" class="w-7 h-7 rounded-full bg-white/10 text-white flex items-center justify-center text-xs">✕</button>
                  </div>

                  <div class="flex-1 p-3.5 space-y-2.5 overflow-y-auto bg-zinc-50 max-h-64">
                    ${chatMessages.map(m => `
                      <div class="flex ${m.sender === 'client' ? 'justify-end' : 'justify-start'}">
                        <div class="max-w-[82%] px-3.5 py-2 rounded-2xl text-xs ${m.sender === 'client' ? 'bg-black text-white' : 'bg-pink-600 text-white shadow-sm'}">
                          <p class="leading-relaxed">${m.text}</p>
                          <span class="block text-[9px] opacity-75 mt-0.5 text-right">${m.sender === 'client' ? 'Tú' : 'RB Boutique'} • ${m.time || ''}</span>
                        </div>
                      </div>
                    `).join('')}
                  </div>

                  <div class="p-2.5 bg-white border-t border-zinc-200 flex gap-2">
                    <input id="floating-chat-input" type="text" placeholder="Escribe un mensaje..." onkeydown="if(event.key==='Enter'){ event.preventDefault(); sendClientSupportMessage(); }" class="flex-1 px-3.5 py-2 rounded-xl bg-zinc-100 text-xs text-zinc-900 focus:outline-none focus:ring-1 focus:ring-black" />
                    <button onclick="sendClientSupportMessage()" class="px-4 py-2 rounded-xl bg-pink-600 hover:bg-pink-500 text-white font-black text-xs shrink-0">Enviar</button>
                  </div>
                </div>
              ` : ''}

              <button id="floating-support-bubble-btn" onclick="openClientFloatingChat()" class="relative w-14 h-14 rounded-full bg-gradient-to-tr from-pink-600 to-rose-500 text-white shadow-[0_8px_25px_rgba(225,29,72,0.5)] flex items-center justify-center text-2xl hover:scale-105 transition border-2 border-white ${state.isBubbleDisintegrating ? 'bubble-disintegrating-core' : ''}">
                ${state.isBubbleDisintegrating ? '' : '💬'}
                ${hasUnreadReply ? `<span class="absolute -top-1 -right-1 px-2 py-0.5 rounded-full bg-black text-white text-[9px] font-black uppercase border border-white animate-bounce">Nuevo</span>` : ''}
              </button>
            </div>
          `;
        }
      }

      return html;
    }

    function renderApp() {
      const root = document.getElementById('app'); if (!root) return;
      const activeEl = document.activeElement; const actTag = activeEl ? activeEl.tagName : null; const actPh = activeEl ? activeEl.getAttribute('placeholder') : null; const cStart = activeEl && typeof activeEl.selectionStart === 'number' ? activeEl.selectionStart : null;
      root.innerHTML = (state.appMode === 'storefront' ? renderStorefrontHTML() : renderBackofficeHTML()) + renderModalsHTML();
      if (actTag === 'INPUT' && actPh) { const rest = root.querySelector(`input[placeholder="${actPh}"]`); if (rest) { rest.focus(); if (cStart !== null && rest.type === 'text') { try { rest.setSelectionRange(cStart, cStart); } catch (e) {} } } }
    }

    window.onload = function () { initDynamicPwaManifest(); renderApp(); };
    initDynamicPwaManifest(); renderApp();
  </script>
</body>
</html>
