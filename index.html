  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade { animation: fadeIn 0.22s ease-out forwards; }
    
    @keyframes bounceSlow { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .animate-bounce-slow { animation: bounceSlow 1.8s infinite ease-in-out; }
    
    @keyframes marqueeText { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-50%, 0, 0); } }
    .animate-marquee {
      display: inline-block; white-space: nowrap;
      animation: marqueeText 22s linear infinite;
      will-change: transform;
      backface-visibility: hidden;
      perspective: 1000px;
      transform: translateZ(0);
    }

    @keyframes neonPulseAlert {
      0%, 100% { box-shadow: 0 0 6px #e11d48, 0 0 14px #e11d48; background: linear-gradient(135deg, #ffe4e6, #fecdd3); color: #9f1239; border-color: #f43f5e; }
      50% { box-shadow: 0 0 2px #e11d48; background: #18181b; color: #fb7185; border-color: #e11d48; }
    }
    .neon-alert { animation: neonPulseAlert 1.3s infinite ease-in-out; font-weight: 900; }

    @media print {
      body * { visibility: hidden !important; }
      #printable-area, #printable-area * { visibility: visible !important; }
      #printable-area { position: absolute !important; left: 0 !important; top: 0 !important; width: 100% !important; max-width: 320px !important; background: #ffffff !important; color: #000000 !important; padding: 8px !important; margin: 0 auto !important; box-shadow: none !important; border: none !important; }
      .no-print { display: none !important; }
    }
  </style>
</head>

    function isIOSDevice() {
      const ua = window.navigator.userAgent || '';
      return Boolean(/iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1));
    }
    function isInStandaloneMode() {
      return (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true);
    }

    function generateRBIconDataURL(size = 512) {
      try {
        const canvas = document.createElement('canvas'); canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, size, size);
        ctx.strokeStyle = '#db2777'; ctx.lineWidth = Math.round(size * 0.03);
        ctx.strokeRect(Math.round(size * 0.04), Math.round(size * 0.04), Math.round(size * 0.92), Math.round(size * 0.92));
        ctx.fillStyle = '#ffffff'; ctx.font = `900 ${Math.round(size * 0.44)}px sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('RB', size / 2, size * 0.44);
        ctx.fillStyle = '#ec4899'; ctx.font = `800 ${Math.round(size * 0.085)}px sans-serif`; ctx.fillText('BOUTIQUE', size / 2, size * 0.76);
        return canvas.toDataURL('image/png');
      } catch (e) { return ''; }
    }

    function initDynamicPwaManifest() {
      const icon192 = generateRBIconDataURL(192);
      const icon512 = generateRBIconDataURL(512);
      const appleLink = document.getElementById('apple-touch-icon-link');
      if (appleLink && icon192) appleLink.href = icon192;
      const manifestObj = { name: 'RB Boutique', short_name: 'RB Boutique', display: 'standalone', background_color: '#000000', theme_color: '#000000', icons: [{ src: icon192, sizes: '192x192', type: 'image/png' }, { src: icon512, sizes: '512x512', type: 'image/png' }] };
      try {
        const blob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
        const manifestLink = document.getElementById('pwa-manifest-link');
        if (manifestLink) manifestLink.href = URL.createObjectURL(blob);
      } catch (e) {}
    }

    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredInstallPrompt = e; renderApp(); });
    window.addEventListener('appinstalled', () => { deferredInstallPrompt = null; state.isAppInstalled = true; state.showPwaInstallModal = false; showToast('¡App Oficial instalada!'); renderApp(); });

    window.handleInstallClick = async function () {
      if (deferredInstallPrompt) {
        deferredInstallPrompt.prompt();
        const { outcome } = await deferredInstallPrompt.userChoice;
        if (outcome === 'accepted') { deferredInstallPrompt = null; state.isAppInstalled = true; state.showPwaInstallModal = false; }
        renderApp();
      } else {
        state.isAppInstalled = true;

      { id: 'Vestidos', label: 'Vestidos', icon: `<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3l3 4.5-2 3.5 4 9H7l4-9-2-3.5L12 3z"/></svg>`, badge: '' },

      { id: 'Paca', label: 'Paca', icon: `<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125z"/></svg>`, badge: 'HOT', subcategories: ['Mujer', 'Hombres', 'Niños', 'Niñas', 'Deportivo Mujer', 'Deportivo Hombre'] }
    ];

    const DEFAULT_PACA_SUBCATEGORIES = ['Mujer', 'Hombres', 'Niños', 'Niñas', 'Deportivo Mujer', 'Deportivo Hombre'];

    function loadStored(key, fallback) { try { const raw = window.localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; } catch (e) { return fallback; } }
    
    function saveStored(key, data) { 
      try { window.localStorage.setItem(key, JSON.stringify(data)); } catch (e) {} 
      if (window.dbRef) { window.dbRef.child(key).set(data).catch(e => console.error("Firebase sync error:", e)); }
    }

    const firebaseConfig = {
      apiKey: "AIzaSyDmoBjH3dbXNIIlu9F0KbugylDk58lzomw",
      authDomain: "rb-boutique-37a67.firebaseapp.com",
      databaseURL: "https://rb-boutique-37a67-default-rtdb.firebaseio.com",
      projectId: "rb-boutique-37a67",
      storageBucket: "rb-boutique-37a67.firebasestorage.app",
      messagingSenderId: "255730748931",
      appId: "1:255730748931:web:8ebbabf8b9309b3ed94836"
    };

    try {
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
        window.dbRef = firebase.database().ref('rb_boutique_data');
        window.auth = firebase.auth();
        
        window.dbRef.on('value', (snapshot) => {
          const cloudData = snapshot.val();
          if (cloudData) {
            if (cloudData.rb_boutique_products) state.products = cloudData.rb_boutique_products;
            if (cloudData.rb_boutique_sales) state.salesHistory = cloudData.rb_boutique_sales;
            if (cloudData.rb_boutique_vip_clients) {
                state.vipClients = cloudData.rb_boutique_vip_clients;
                if(state.currentUser && state.currentUser.id) {
                    const updatedSelf = state.vipClients.find(c => c.id === state.currentUser.id);
                    if(updatedSelf) {
                        // Verifica si hay regalos nuevos desde la nube
                        if(updatedSelf.vipGift && (!state.currentUser.vipGift || state.currentUser.vipGift.message !== updatedSelf.vipGift.message)) {
                            state.showGiftCelebration = true;
                        }
                        state.currentUser = updatedSelf;
                        saveStored('rb_boutique_current_user', updatedSelf);
                    }
                }
            }
            if (cloudData.rb_boutique_petty_cash) state.pettyCash = cloudData.rb_boutique_petty_cash;
            if (cloudData.rb_boutique_categories) state.visualCategories = cloudData.rb_boutique_categories;
            if (cloudData.rb_boutique_tickets) state.supportTickets = cloudData.rb_boutique_tickets;
            if (cloudData.rb_boutique_config) state.storeConfig = cloudData.rb_boutique_config;
            renderApp();
          } else {
            if (state.products.length > 0) saveStored('rb_boutique_products', state.products);
            if (state.visualCategories.length > 0) saveStored('rb_boutique_categories', state.visualCategories);
            if (state.storeConfig) saveStored('rb_boutique_config', state.storeConfig);
          }
        });
      }
    } catch (error) { console.error("Firebase Init Error:", error); }

    let initialVisits = loadStored('rb_boutique_visits', 0);
    initialVisits += 1; saveStored('rb_boutique_visits', initialVisits);

    const state = {

      selectedCategory: 'Todo', selectedSubcategory: 'Todo', catalogSearch: '',
      
      authStatus: loadStored('rb_boutique_current_user', null) ? 'registered' : 'welcome', 
      showGoogleFormInWelcome: false, showAuthRegisterModal: false,
      currentUser: loadStored('rb_boutique_current_user', null),
      regForm: { name: '', email: '', phone: '', referralCode: '' },

      logoTapCount: 0, showAdminLoginModal: false, adminUser: '', adminPass: '',
      pinAuthModal: null, confirmModal: null, editingClientModal: null, vipGiftModal: null,
      showNewCategoryModal: false, newCatForm: { label: '', badge: 'NEW', subcategoriesText: '' },

      storeConfig: loadStored('rb_boutique_config', {
        whatsappNumber: '5219991234567', bankName: 'BBVA México', accountHolder: 'Rebeca • RB Boutique Oficial', clabe: '012180015489632147', cardNumber: '4152 3138 7654 8910',

      }),

      visualCategories: loadStored('rb_boutique_categories', DEFAULT_VISUAL_CATEGORIES),
      products: loadStored('rb_boutique_products', []),
      vipClients: loadStored('rb_boutique_vip_clients', []),
      supportTickets: loadStored('rb_boutique_tickets', []),

      showGiftCelebration: false,

      selectedProductModal: null, modalSize: '', modalColor: '',
      showPwaInstallModal: false, installGuidePlatform: isIOSDevice() ? 'ios' : 'android', isAppInstalled: isInStandaloneMode(),
      whatsappCheckoutModal: null, toast: null,

      posSearch: '', posCart: [], posCustomerName: 'Cliente Mostrador',
      posPaymentStatus: '100', posDeliveryType: 'mostrador', posShippingFee: 80, posDeliveryAddress: '', posDeliveryMapUrl: '', posPaymentMethod: 'efectivo', cashReceived: '',

      salesHistory: loadStored('rb_boutique_sales', []),
      lastReceipt: null, showCorteModal: false, editingTicketModal: null,
      
      showNewProductModal: false, inventorySectionFilter: 'Todo', inventorySubcategoryFilter: 'Todo', isEditingProduct: false,

    };

    (function ensurePacaCategoryExists() {
      const pacaIdx = state.visualCategories.findIndex(c => c.id.toLowerCase() === 'paca');
      if (pacaIdx === -1) {
        state.visualCategories.push({
          id: 'Paca', label: 'Paca',
          icon: `<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125z"/></svg>`,
          badge: 'HOT', subcategories: [...DEFAULT_PACA_SUBCATEGORIES]
        });
        saveStored('rb_boutique_categories', state.visualCategories);
      } else if (!Array.isArray(state.visualCategories[pacaIdx].subcategories) || state.visualCategories[pacaIdx].subcategories.length === 0) {
        state.visualCategories[pacaIdx].subcategories = [...DEFAULT_PACA_SUBCATEGORIES];
        saveStored('rb_boutique_categories', state.visualCategories);
      }
    })();

    function getCategorySubcategories(categoryId) {
      if (!categoryId || categoryId === 'Todo') return [];
      const found = state.visualCategories.find(c => c.id.toLowerCase() === String(categoryId).toLowerCase());
      if (found && Array.isArray(found.subcategories) && found.subcategories.length > 0) return found.subcategories;
      if (String(categoryId).toLowerCase() === 'paca') return DEFAULT_PACA_SUBCATEGORIES;
      return [];
    }

    let toastTimer = null;
    function showToast(message, type = 'success') {
      state.toast = { message, type }; renderApp();
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { state.toast = null; renderApp(); }, 3400);
    }

    window.copyTextSafe = function(text, msg = '📋 Datos copiados') {
      try {
        const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
        showToast(msg);
      } catch (e) { showToast(msg); }
    };

    function formatSocialUrl(raw, platform) {
      if (!raw) return '#'; const clean = raw.trim();
      if (clean.startsWith('http://') || clean.startsWith('https://')) return clean;
      const handle = clean.replace(/^@/, '');
      if (platform === 'instagram') return `https://instagram.com/${handle}`;
      if (platform === 'facebook') return `https://facebook.com/${handle}`;
      if (platform === 'tiktok') return `https://tiktok.com/@${handle}`;
      return `https://${clean}`;
    }

    function checkLowStockAlert() {
      const lowItems = state.products.filter(p => Object.values(p.sizes || {}).some(q => Number(q) <= 2));
      if (lowItems.length > 0) showToast(`🚨 Alerta: Tienes ${lowItems.length} prenda(s) con bajo inventario.`, 'error');
    }

    function getTotalStock(product) { return Object.values(product.sizes || {}).reduce((a, b) => a + Number(b || 0), 0); }

    window.openProductDetail = function (productId) {
      const p = state.products.find(x => x.id === productId); if (!p) return;
      const firstAvail = Object.entries(p.sizes || {}).find(([, q]) => Number(q) > 0)?.[0] || Object.keys(p.sizes || {})[0] || 'UNITALLA';
      state.selectedProductModal = p; state.modalSize = firstAvail; state.modalColor = (p.colors && p.colors[0]?.name) || 'Único'; renderApp();
    };

    window.toggleWishlist = function (productId) {
      if (!state.currentUser && state.authStatus === 'guest') { state.showAuthRegisterModal = true; renderApp(); return; }
      if (state.wishlist.includes(productId)) { state.wishlist = state.wishlist.filter(id => id !== productId); showToast('Eliminado de tus favoritos'); } 
      else { state.wishlist.push(productId); showToast('❤️ Guardado en tus favoritos'); }
      saveStored('rb_boutique_wishlist', state.wishlist); renderApp();
    };

    window.loginWithGoogle = function() {
        const provider = new firebase.auth.GoogleAuthProvider();
        firebase.auth().signInWithPopup(provider).then((result) => {
            const user = result.user;
            let existingClient = state.vipClients.find(c => c.email.toLowerCase() === user.email.toLowerCase());
            
            if (existingClient) {
                state.currentUser = existingClient;
                saveStored('rb_boutique_current_user', existingClient);
                state.authStatus = 'registered';
                state.showAuthRegisterModal = false;
                state.showGoogleFormInWelcome = false;
                showToast(`¡Bienvenida de nuevo, ${existingClient.name}!`);
                if (existingClient.vipGift && !existingClient.vipGift.notified) state.showGiftCelebration = true;
                renderApp();
            } else {
                // Nuevo usuario, pedir WhatsApp y código referido
                state.regForm.name = user.displayName || '';
                state.regForm.email = user.email || '';
                state.regForm.phone = '';
                state.regForm.referralCode = '';
                state.showGoogleFormInWelcome = true;
                renderApp();
            }
        }).catch(err => {
            showToast('Error al conectar con Google. Revisa tu conexión.', 'error');
            console.error(err);
        });
    };

    window.submitCompleteRegistration = function(e) {
        if (e) e.preventDefault();
        const { name, email, phone, referralCode } = state.regForm;
        if (!phone || phone.length < 10) { showToast('El WhatsApp es obligatorio (10 dígitos)', 'error'); return; }
        
        const newCode = name.split(' ')[0].toUpperCase() + Math.floor(1000 + Math.random() * 9000);
        
        let clientRecord = { 
            id: `VIP-${Date.now()}`, name, email, phone, discountPct: 10, joinedAt: new Date().toLocaleDateString(), vipGift: null,
            referralCode: newCode, referredByCode: (referralCode || '').trim().toUpperCase(), hasMadePurchase: false, successfulReferrals: 0,
            address: '', mapsUrl: ''
        };
        
        state.vipClients = [clientRecord, ...state.vipClients];
        saveStored('rb_boutique_vip_clients', state.vipClients);
        state.currentUser = clientRecord; saveStored('rb_boutique_current_user', clientRecord);
        state.authStatus = 'registered'; state.showAuthRegisterModal = false; state.showGoogleFormInWelcome = false;

    function getFilteredCatalogProducts() {

      return state.products.filter(p => {

        const matchesNew = state.clientBottomTab !== 'new' || p.isNew || p.isTrending;
        return matchesCat && matchesSubcat && matchesSearch && matchesNew;
      });
    }

    function getCustomerBagCalculations() {
      const rawMerchandise = state.customerCart.reduce((a, b) => a + b.price * b.qty, 0);
      const isVip = state.authStatus === 'registered' && state.currentUser;
      const vipDiscount = isVip ? Math.round(rawMerchandise * 0.10) : 0;
      let extraRewardDiscount = 0; let extraRewardLabel = '';
      if (state.currentUser && state.currentUser.vipGift && !state.currentUser.vipGift.used) {
        const g = state.currentUser.vipGift; extraRewardLabel = `🎁 Regalo VIP (${g.type === 'percent' ? g.value + '%' : '$' + g.value})`;
        extraRewardDiscount = g.type === 'percent' ? Math.round((rawMerchandise - vipDiscount) * (Number(g.value) / 100)) : Number(g.value || 0);
      }
      const netMerchandise = Math.max(0, rawMerchandise - vipDiscount - extraRewardDiscount);
      const isHomeDelivery = state.customerDeliveryType === 'delivery';
      const shippingFee = isHomeDelivery ? 80 : 0; 
      const requiredAdvance50 = isHomeDelivery ? Math.round(netMerchandise * 0.5) + shippingFee : netMerchandise;
      const grandTotal = netMerchandise + shippingFee;
      return { rawMerchandise, vipDiscount, extraRewardDiscount, extraRewardLabel, netMerchandise, isHomeDelivery, shippingFee, requiredAdvance50, grandTotal };
    }

    function getPosCalculations() {
      const merchandiseTotal = state.posCart.reduce((a, b) => a + b.price * b.qty, 0);
      let basePayment = merchandiseTotal;
      if (state.posPaymentStatus === 'anticipo') { basePayment = Math.round(merchandiseTotal * (state.posDeliveryType === 'domicilio' ? 0.5 : 0.3)); }
      const shippingFee = state.posDeliveryType === 'domicilio' ? (Number(state.posShippingFee) || 0) : 0;
      const subtotalBeforeFee = basePayment + shippingFee;
      const isCardTerminal = state.posPaymentMethod === 'tarjeta';
      const terminalFee5Pct = isCardTerminal ? Math.round(subtotalBeforeFee * 0.05) : 0;
      const finalChargeToday = subtotalBeforeFee + terminalFee5Pct;
      const pendingBalance = Math.max(0, (merchandiseTotal + shippingFee) - subtotalBeforeFee);
      const cashChange = state.posPaymentMethod === 'efectivo' && Number(state.cashReceived) > finalChargeToday ? Number(state.cashReceived) - finalChargeToday : 0;
      return { merchandiseTotal, basePayment, shippingFee, subtotalBeforeFee, isCardTerminal, terminalFee5Pct, finalChargeToday, pendingBalance, cashChange };
    }

    function getCorteZCalculations() {
      const validSales = state.salesHistory.filter(s => !String(s.status).includes('Devuelto') && !String(s.bankStatus || '').includes('Rechazado'));
      const totalEfectivoVentas = validSales.filter(s => s.method === 'EFECTIVO').reduce((a, b) => a + Number(b.total || 0), 0);
      const totalTarjetaVentas = validSales.filter(s => s.method === 'TARJETA').reduce((a, b) => a + Number(b.total || 0), 0);
      const totalComisionesTerminal = validSales.filter(s => s.method === 'TARJETA').reduce((a, b) => a + Number(b.terminalFee || 0), 0);
      const totalTransferenciaVentas = validSales.filter(s => s.method.includes('TRANSFERENCIA')).reduce((a, b) => a + Number(b.total || 0), 0);
      const totalVentasDia = totalEfectivoVentas + totalTarjetaVentas + totalTransferenciaVentas;
      const openingCash = Number(state.pettyCash.openingBalance || 0);
      const totalExpenses = (state.pettyCash.expenses || []).reduce((a, b) => a + Number(b.amount || 0), 0);
      const exactPhysicalCashInDrawer = openingCash + totalEfectivoVentas - totalExpenses;
      return { totalEfectivoVentas, totalTarjetaVentas, totalComisionesTerminal, totalTransferenciaVentas, totalVentasDia, openingCash, totalExpenses, exactPhysicalCashInDrawer };
    }
